[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-horizon"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "trl>=0.12.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
include = ["*.py", "**/*.py"]
