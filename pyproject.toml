[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-horizon"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "trl>=0.12.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
]
# Pinned exactly to 0.12.2 -- 0.12.3.post1 has a CLI regression where every
# `sky launch` without the deprecated --docker flag fails with
# "False backend is not supported." (backend_name defaults to False, not
# None). See sky/setup_common.sh and the AWS migration plan for context.
aws = [
    "skypilot[aws]==0.12.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
include = ["*.py", "**/*.py"]
